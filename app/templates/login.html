{% extends 'base.html' %}

{% block page_content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-5">
            <div class="text-center mb-4">
                <h4 class="fw-bold" style="color: #0f1f5c;">Welcome Back</h4>
                <p class="text-muted">Sign in to your account</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn w-100 text-white" style="background-color: #0f1f5c;">
                    Sign In
                </button>
            </form>
            <div class="text-center mt-3">
                <small>Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
