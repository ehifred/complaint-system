{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold" style="color: #0f1f5c;">Management Dashboard</h4>
    <span class="text-muted">Analytics & Reporting</span>
</div>

<!-- Stats -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card stat-card p-3">
            <p class="text-muted mb-1">Total Complaints</p>
            <h3 class="fw-bold">{{ total }}</h3>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3" style="border-left: 4px solid #10b981;">
            <p class="text-muted mb-1">Resolved</p>
            <h3 class="fw-bold">{{ resolved }}</h3>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3" style="border-left: 4px solid #f59e0b;">
            <p class="text-muted mb-1">Pending</p>
            <h3 class="fw-bold">{{ pending }}</h3>
        </div>
    </div>
</div>

<!-- Charts -->
<div class="row mb-4">
    <div class="col-md-6">
        <div class="card p-4">
            <h6 class="fw-bold mb-3">Complaint Status Distribution</h6>
            <canvas id="statusChart"></canvas>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-4">
            <h6 class="fw-bold mb-3">Complaints by Category</h6>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card p-4">
            <h6 class="fw-bold mb-3">Monthly Complaint Trend</h6>
            <canvas id="trendChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Status Distribution Chart
    const statusCtx = document.getElementById('statusChart').getContext('2d');
    new Chart(statusCtx, {
        type: 'doughnut',
        data: {
            labels: ['Resolved', 'Pending', 'Other'],
            datasets: [{
                data: [{{ resolved }}, {{ pending }}, {{ total - resolved - pending }}],
                backgroundColor: ['#10b981', '#f59e0b', '#3b82f6'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });

    // Category Chart
    const categoryCtx = document.getElementById('categoryChart').getContext('2d');
    new Chart(categoryCtx, {
        type: 'bar',
        data: {
            labels: {{ category_labels | tojson }},
            datasets: [{
                label: 'Complaints',
                data: {{ category_data | tojson }},
                backgroundColor: '#3b82f6',
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
        }
    });

    // Monthly Trend Chart
    const trendCtx = document.getElementById('trendChart').getContext('2d');
    new Chart(trendCtx, {
        type: 'line',
        data: {
            labels: {{ month_labels | tojson }},
            datasets: [{
                label: 'Complaints',
                data: {{ month_data | tojson }},
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59,130,246,0.1)',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true } }
}
    });
</script>
{% endblock %}
