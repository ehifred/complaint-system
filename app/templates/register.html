{% extends 'base.html' %}

{% block page_content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-5">
            <div class="text-center mb-4">
                <h4 class="fw-bold" style="color: #0f1f5c;">Create Account</h4>
                <p class="text-muted">Register to access the platform</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select">
                        <option value="complainant">Complainant</option>
                        <option value="officer">Complaint Officer</option>
                        <option value="admin">Administrator</option>
                        <option value="management">Management</option>
                    </select>
                </div>
                <button type="submit" class="btn w-100 text-white" style="background-color: #0f1f5c;">
                    Create Account
                </button>
            </form>
            <div class="text-center mt-3">
                <small>Already have an account? <a href="{{ url_for('main.login') }}">Sign in here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
