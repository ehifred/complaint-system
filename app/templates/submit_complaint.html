{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h5 class="fw-bold mb-4" style="color: #0f1f5c;">Submit a Complaint</h5>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Complaint Title</label>
                    <input type="text" name="title" class="form-control" 
                           placeholder="Brief summary of your complaint" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select name="category_id" class="form-select">
                        <option value="">-- Select a category --</option>
                        {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select name="priority" class="form-select">
                        <option value="normal">Normal</option>
                        <option value="high">High</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="6" 
                              placeholder="Describe your complaint in detail..." required></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn text-white" style="background-color: #0f1f5c;">
                        Submit Complaint
                    </button>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
